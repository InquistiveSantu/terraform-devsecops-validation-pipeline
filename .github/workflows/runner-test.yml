name: Windows Runner Tools Test

on:
  push:
    branches:
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools-test:
    name: Verify DevSecOps Tools
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Terraform
        shell: powershell
        run: terraform -version

      - name: Verify TFLint
        shell: powershell
        run: tflint --version

      - name: Verify tfsec
        shell: powershell
        run: tfsec --version

      - name: Verify Gitleaks
        shell: powershell
        run: gitleaks version

      - name: Verify Checkov
        shell: powershell
        run: checkov --version

      - name: Verify Infracost
        shell: powershell
        run: infracost --version