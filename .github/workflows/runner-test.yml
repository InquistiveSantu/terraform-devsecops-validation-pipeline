name: Windows Runner Test

on:
  push:
    branches: ["feature/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-test:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - uses: actions/checkout@v4

      - name: Verify Runner
        shell: powershell
        run: |
          Write-Host "Windows runner is working"
          $env:COMPUTERNAME
          $PSVersionTable.PSVersion
          git --version